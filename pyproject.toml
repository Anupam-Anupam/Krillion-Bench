[project]
name = "krillion-benchmark"
version = "0.1.0"
description = "Deadline-aware Browser Use runner for Krillion"
requires-python = ">=3.12"
dependencies = [
  "browser-use==0.13.14",
  "browser-use-sdk==3.12.1",
  "playwright==1.64.1",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

